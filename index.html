<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue de la Bibliothèque</title>
    <link rel="stylesheet" href="style.css">
    <!-- PapaParse pour lire le CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>📚 Catalogue de la Bibliothèque</h1>
        <div id="status"></div>
        <div id="bookCount"></div>

        <!-- Formulaire / Champs de recherche -->
        <div class="filters-grid">
            <input type="text" id="fCote" placeholder="Rechercher par Cote...">
            <input type="text" id="fTitre" placeholder="Rechercher par Titre...">
            <input type="text" id="fAuteur" placeholder="Rechercher par Auteur...">
            <input type="text" id="fResume" placeholder="Rechercher dans le Résumé...">
        </div>

        <!-- Grille des livres (Cartes / Pavés) -->
        <div id="booksGrid" class="books-grid"></div>

        <!-- Pagination du bas -->
        <div id="pagination" class="pagination-container"></div>
    </div>

    <!-- ======================================================= -->
    <!-- FENÊTRE MODALE (POP-UP FICHE DU LIVRE) - INDISPENSABLE ! -->
    <!-- ======================================================= -->
    <div id="bookModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script src="app.js"></script>
</body>
</html>
